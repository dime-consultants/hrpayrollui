services:
  frontend:
    build:
      context: .
      args:
        VITE_API_TARGET: ${VITE_API_TARGET}

    image: hr-payroll-ui:latest
    container_name: hr_payroll_frontend
    restart: unless-stopped

    ports:
      - "7080:80"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      VITE_API_TARGET: ${VITE_API_TARGET}

    networks:
      - frontend_network

networks:
  frontend_network:
    driver: bridge