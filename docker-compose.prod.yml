# version: "3.9"

   services:
     frontend:
       build:
         context: .
         args:
           VITE_API_BASE: /api/v1
       image: hr-payroll-ui:latest
       container_name: hr_payroll_frontend
       restart: unless-stopped
       ports:
         - "7080:80"
       networks:
         - frontend_network

   networks:
     frontend_network:
       driver: bridge