server {
    listen 80;
    server_name payroll.dimeapp.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name payroll.dimeapp.co.ke;

    ssl_certificate     /etc/letsencrypt/live/payroll.dimeapp.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payroll.dimeapp.co.ke/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 12M;

    # API traffic → same Django backend the HR-Payroll app already uses
    location /api/ {
        proxy_pass        http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    # Everything else → the static React build served by the frontend container
    location / {
        proxy_pass        http://127.0.0.1:7080;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto https;
    }
}